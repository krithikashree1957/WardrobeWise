<script>
        // Micro-interactions for buttons
        document.querySelectorAll('button[type="button"]').forEach(btn => {
            btn.addEventListener('click', function() {
                // If it's a sibling group (like Gender)
                if(this.parentElement.classList.contains('flex')) {
                    Array.from(this.parentElement.children).forEach(s => {
                        s.classList.remove('border-primary', 'bg-primary/5');
                        s.classList.add('border-transparent', 'bg-surface-container-low');
                    });
                    this.classList.remove('border-transparent', 'bg-surface-container-low');
                    this.classList.add('border-primary', 'bg-primary/5');
                }
            });
        });

        // Form submission animation
        document.getElementById('registrationForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin" data-icon="progress_activity">progress_activity</span>';
            
            setTimeout(() => {
                btn.innerHTML = '<span class="material-symbols-outlined" data-icon="check_circle">check_circle</span> Profile Ready';
                btn.classList.replace('from-primary', 'from-emerald-500');
                btn.classList.replace('to-[#8b72d1]', 'to-emerald-400');
                btn.style.boxShadow = '0px 10px 30px rgba(16, 185, 129, 0.3)';
            }, 1500);
        });

        // Parallax effect on sections
        window.addEventListener('scroll', () => {
            const sections = document.querySelectorAll('section');
            sections.forEach((section, index) => {
                const speed = 0.05 * (index + 1);
                const rect = section.getBoundingClientRect();
                if(rect.top < window.innerHeight && rect.bottom > 0) {
                    section.style.transform = `translateY(${(rect.top - window.innerHeight/2) * speed}px)`;
                }
            });
        });
    </script>
