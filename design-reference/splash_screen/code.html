<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">

<title>WardrobeWise | Welcome</title>
<!-- Google Fonts: Inter for that premium, clean look -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;display=swap" rel="stylesheet">

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<!-- Tailwind CSS with Plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Injection of Custom Tailwind Config -->

        darkMode: "class",
        theme: {
          extend: {

                    "on-error": "#ffffff",
                    "tertiary": "#555f6f",
                    "surface-container-highest": "#e2e2e2",
                    "secondary-container": "#bae6fd",
                    "outline": "#7a7583",
                    "on-primary-fixed": "#21005e",
                    "surface-variant": "#e2e2e2",
                    "on-secondary": "#ffffff",
                    "primary-fixed-dim": "#cebdff",
                    "secondary-fixed-dim": "#a1cde3",
                    "error-container": "#ffdad6",
                    "surface-container-lowest": "#ffffff",
                    "on-tertiary-fixed-variant": "#3d4756",
                    "on-tertiary-container": "#2b3543",
                    "tertiary-fixed-dim": "#bdc7d9",
                    "on-surface-variant": "#494552",
                    "on-primary-fixed-variant": "#4f319c",
                    "on-background": "#1a1c1c",
                    "primary-fixed": "#e8ddff",
                    "surface-bright": "#f9f9f9",
                    "secondary": "#396477",
                    "surface-container-low": "#f3f3f4",
                    "on-secondary-fixed-variant": "#1e4c5f",
                    "inverse-on-surface": "#f0f1f1",
                    "tertiary-fixed": "#d9e3f6",
                    "surface": "#f9f9f9",
                    "on-primary-container": "#3c1989",
                    "tertiary-container": "#939daf",
                    "primary": "#674bb5",
                    "on-surface": "#1a1c1c",
                    "surface-container": "#eeeeee",
                    "background": "#f9f9f9",
                    "on-secondary-fixed": "#001f2a",
                    "secondary-fixed": "#bee9ff",
                    "surface-dim": "#dadada",
                    "error": "#ba1a1a",
                    "inverse-primary": "#cebdff",
                    "on-tertiary-fixed": "#121c2a",
                    "on-error-container": "#93000a",
                    "primary-container": "#a78bfa",
                    "surface-tint": "#674bb5",
                    "outline-variant": "#cac4d4",
                    "on-tertiary": "#ffffff",
                    "on-primary": "#ffffff",
                    "surface-container-high": "#e8e8e8",
                    "on-secondary-container": "#3d687c"
            },
            "borderRadius": {
                    "DEFAULT": "1rem",
                    "lg": "2rem",
                    "xl": "3rem",
                    "full": "9999px"
            },
            "spacing": {

                    "stack-lg": "32px",
                    "unit": "8px",
                    "gutter": "24px",
                    "container-padding-desktop": "40px",
                    "container-padding-mobile": "20px",
                    "stack-sm": "8px"
            },
            "fontFamily": {
                    "title-md": ["Inter"],
                    "headline-lg-mobile": ["Inter"],
                    "display-lg": ["Inter"],
                    "body-lg": ["Inter"],
                    "label-caps": ["Inter"],
                    "body-sm": ["Inter"],
                    "headline-lg": ["Inter"]
            },
            "fontSize": {
                    "title-md": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                    "headline-lg-mobile": ["28px", {"lineHeight": "36px", "fontWeight": "700"}],
                    "display-lg": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "label-caps": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}],
                    "body-sm": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                    "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "700"}]
            }
          },
        },
      }
    </script>
<style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #f9f9f9;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        /* Glassmorphism Keyframe Animations */
        @keyframes floating {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0px); }
        }

        @keyframes fadeInScale {
            0% { opacity: 0; transform: scale(0.95); }
            100% { opacity: 1; transform: scale(1); }
        }

        @keyframes bg-drift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .animate-drift {
            background-size: 400% 400%;
            animation: bg-drift 15s ease infinite;
        }

        .animate-float {
            animation: floating 4s ease-in-out infinite;
        }

        .animate-entrance {
            animation: fadeInScale 1.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        /* Custom Glass Effect Utility */
        .glass-panel {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.04);
        }

        .glass-button {
            background: linear-gradient(135deg, rgba(167, 139, 250, 0.2), rgba(186, 230, 253, 0.2));
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 4px 12px rgba(103, 75, 181, 0.1);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  <style>
            @keyframes bounce-x {
                0%, 100% { transform: translateX(0); }
                50% { transform: translateX(4px); }
            }
            .animate-bounce-x {
                animation: bounce-x 1s infinite;
            }
        </style></head>
<body class="h-screen w-screen font-body-lg text-on-background selection:bg-primary-container/30">
<!-- Background Layer: Soft Blurred Gradient -->
<div class="fixed inset-0 -z-10 bg-gradient-to-br from-primary-fixed via-secondary-fixed to-surface-container-low animate-drift"></div>
<!-- Atmospheric Ambient Blobs -->
<div class="fixed top-[-10%] left-[-10%] w-[50%] h-[50%] bg-primary/20 blur-[120px] rounded-full animate-float"></div>
<div class="fixed bottom-[-10%] right-[-10%] w-[60%] h-[60%] bg-secondary-container/30 blur-[120px] rounded-full" style="animation: floating 6s ease-in-out infinite reverse;"></div>
<!-- Main Content Container -->
<main class="relative h-full flex flex-col items-center justify-between px-container-padding-mobile md:px-container-padding-desktop py-stack-lg max-w-screen-xl mx-auto overflow-hidden">
<!-- Top Spacer (Maintains balance with bottom button) -->
<div class="h-16"></div>
<!-- Center: Branding Section -->
<div class="flex flex-col items-center text-center animate-entrance">
<!-- Animated Icon Logo -->
<div class="mb-stack-lg relative">
<div class="absolute inset-0 bg-primary/20 blur-2xl rounded-full scale-150 animate-pulse"></div>
<div class="relative glass-panel w-24 h-24 md:w-32 md:h-32 rounded-lg flex items-center justify-center animate-float">
<span class="material-symbols-outlined text-primary text-[48px] md:text-[64px]" style="font-variation-settings: 'FILL' 1;">
                        checkroom
                    </span>
</div>
</div>
<!-- Brand Name -->
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface tracking-tighter mb-stack-sm">
                WardrobeWise
            </h1>
<!-- Subtitle with Soft Pill styling -->
<div class="inline-flex items-center px-4 py-1.5 rounded-full bg-secondary-container/10 border border-secondary/20">
<span class="font-label-caps text-label-caps text-secondary-fixed-dim uppercase tracking-widest">
                    Your AI Fashion Companion
                </span>
</div>
</div>
<!-- Bottom: Action Section -->
<div class="w-full flex flex-col items-center gap-stack-md pb-stack-lg animate-entrance" style="animation-delay: 0.3s;">
<!-- Get Started Button -->
<button class="group relative w-full max-w-sm px-gutter py-stack-md glass-button rounded-xl overflow-hidden transition-all duration-300 hover:scale-[1.02] active:scale-[0.98]">
<!-- Subtle internal shine effect -->
<div class="absolute inset-0 bg-gradient-to-r from-transparent via-white/20 to-transparent -translate-x-full group-hover:translate-x-full transition-transform duration-1000"></div>
<div class="flex items-center justify-center gap-stack-sm relative z-10">
<span class="font-title-md text-title-md text-primary">Get Started</span>
<span class="material-symbols-outlined text-primary animate-bounce-x">arrow_forward</span>
</div>
</button>
<!-- Secondary/Legal Link -->
<p class="font-body-sm text-body-sm text-on-surface-variant opacity-60">
                Sign in or create an account
            </p>
</div>
</main>
<!-- Interactive Layer: Cursor Follow Effect -->
<div class="pointer-events-none fixed top-0 left-0 w-[400px] h-[400px] bg-primary/5 blur-[80px] rounded-full -translate-x-1/2 -translate-y-1/2 z-0 opacity-0 transition-opacity duration-700" id="cursor-glow"></div>
<script>
        // Micro-interaction for cursor glow
        const glow = document.getElementById('cursor-glow');
        window.addEventListener('mousemove', (e) => {
            glow.style.opacity = '1';
            glow.style.left = e.clientX + 'px';
            glow.style.top = e.clientY + 'px';
        });

        // Simple bounce-x animation via script for the arrow
        const style = document.createElement('style');
        style.textContent = `
            @keyframes bounce-x {
                0%, 100% { transform: translateX(0); }
                50% { transform: translateX(4px); }
            }
            .animate-bounce-x {
                animation: bounce-x 1s infinite;
            }
        `;
        document.head.appendChild(style);
    </script>
</body></html>
